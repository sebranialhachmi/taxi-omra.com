name: Export content
on:
  push:
    branches: [content/export]
    paths: [".github/workflows/export-content.yml", "scripts/export-content.mjs"]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Export
        env:
          SUPABASE_URL: https://uauaekfobngwolmwujhc.supabase.co
          SUPABASE_KEY: sb_publishable_4m8xSTNljzBlWsZl8WQaQw_PxpaU3qy
        run: node scripts/export-content.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add content/raw
          git commit -m "Export content from old database [skip ci]" || exit 0
          git push
